name: Daily Stock Scraper

on:
  push:
    branches: [ main ]
  schedule:
    # Runs every day at 00:00 UTC (8 PM EST / 5 PM PST / 3 AM local time)
    - cron: '0 0 * * *'
  # Allows triggering the scraper manually from the GitHub Repository Actions tab
  workflow_dispatch:
    inputs:
      mode:
        description: 'Scraper execution mode (weekly or daily)'
        required: true
        default: 'weekly'
        type: choice
        options:
          - weekly
          - daily
      reset_db:
        description: 'Reset database schema before running (WARNING: drops all tables)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv (Fast package manager)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        # Install directly to system to speed up runner execution
        run: uv pip install -r backend/requirements.txt --system

      - name: Run Scraper Pipeline
        env:
          # Reads the Supabase database connection string stored in GitHub secrets
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.reset_db }}" = "true" ]; then
              echo "Resetting database schema..."
              python backend/reset_db.py
            fi
            echo "Manually triggered: Running pipeline in ${{ github.event.inputs.mode }} mode..."
            python -m backend.pipeline all ${{ github.event.inputs.mode }}
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "Push triggered: Resetting database schema..."
            python backend/reset_db.py
            echo "Push triggered: Running verification pipeline on Supabase..."
            python -m backend.pipeline 5 weekly
          else
            DAY_OF_WEEK=$(date +%u)
            if [ "$DAY_OF_WEEK" -eq 7 ]; then
              echo "Scheduled Sunday: Running weekly pipeline list refresh..."
              python -m backend.pipeline all weekly
            else
              echo "Scheduled Daily: Running daily pipeline updates..."
              python -m backend.pipeline all daily
            fi
          fi

